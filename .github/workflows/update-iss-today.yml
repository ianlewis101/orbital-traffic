name: Update ISS Today Log

on:
  schedule:
    # Daily at 12:07 UTC — offset from the top of the hour so this never
    # technically overlaps update-capsule-status.yml's hourly "0 * * * *" run.
    - cron: "7 12 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the updated iss-today.json
      actions: write # dispatches deploy-pages.yml — see the rebuild step below

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch ISS crew and activity, write iss-today.json
        run: node tools/update-iss-today.mjs

      - name: Commit updated iss-today.json (if changed)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add iss-today.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ISS Today log unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore: update ISS today log $(date -u +'%Y-%m-%d')"

          # Rebase onto whatever another scheduled job may have just pushed
          # (e.g. update-capsule-status.yml) and retry, instead of failing
          # outright on a losing push.
          #
          # `pushed` is not decoration: without it the trailing $GITHUB_OUTPUT
          # write becomes the step's last command, so five failed pushes would
          # exit 0 and report success. The loop has to be the last thing that
          # decides the exit status, or an explicit check has to replace it.
          pushed=false
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || break
            if git push; then pushed=true; break; fi
          done
          if [ "$pushed" != true ]; then
            echo "Could not push after 5 attempts — not requesting a rebuild." >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # See refresh-tle-data.yml's equivalent step for the full reasoning: a
      # GITHUB_TOKEN push starts no workflow, and workflow_dispatch is one of
      # the two events exempt from that rule — so the rebuild is requested
      # explicitly, with no long-lived credential involved.
      - name: Rebuild and redeploy the site with the new data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
