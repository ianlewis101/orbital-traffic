name: Refresh TLE Data

on:
  schedule:
    # Every day at 06:00 UTC (fresh data for morning traffic)
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the updated satellites.json
      actions: write # dispatches deploy-pages.yml — see the rebuild step below

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch fresh TLEs
        run: node tools/fetch-tles.mjs

      - name: Commit updated catalog (if changed)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data/satellites.json launch-reentry-log.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Catalog unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh TLE data $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Rebase onto whatever another scheduled job may have just pushed
          # onto the branch this run is on ($GITHUB_REF_NAME — main for the
          # scheduled runs) and retry, instead of failing outright on a
          # losing push — same pattern as update-capsule-status.yml and
          # update-iss-today.yml already use (see F13). This workflow didn't
          # need it while it only ever touched satellites.json alone, but
          # now shares launch-reentry-log.json's commit envelope with the
          # same script, so it gets the same resilience its siblings have.
          #
          # `pushed` is not decoration: without it the trailing $GITHUB_OUTPUT
          # write becomes the step's last command, so five failed pushes would
          # exit 0 and report success. The loop has to be the last thing that
          # decides the exit status, or an explicit check has to replace it.
          pushed=false
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" || break
            if git push; then pushed=true; break; fi
          done
          if [ "$pushed" != true ]; then
            echo "Could not push after 5 attempts — not requesting a rebuild." >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # This push cannot start the Pages deploy on its own. Per GitHub's docs,
      # "Events triggered by the GITHUB_TOKEN will not create a new workflow
      # run" — the recursion guard — so deploy-pages.yml never saw the daily
      # data commit, and the published site kept whatever bundled catalog the
      # last PR merge happened to build. Measured before this fix: 120
      # deploy-pages runs between 2026-07-07 and 2026-08-19, every single
      # push-triggered one a PR merge, not one a data commit.
      #
      # workflow_dispatch is one of the two events GitHub exempts from that
      # rule ("workflow_dispatch and repository_dispatch events always create
      # workflow runs"), so asking for the run explicitly is enough. That is
      # why this needs no personal access token and no GitHub App: the job's
      # own ephemeral GITHUB_TOKEN plus `actions: write` does it, with nothing
      # long-lived to leak, rotate, or silently expire.
      #
      # --ref main is deliberately hardcoded rather than ${{ github.ref_name }}:
      # the scheduled run only ever happens on main, and pinning it means a
      # manual dispatch of this workflow from a feature branch can never
      # publish that branch to production.
      - name: Rebuild and redeploy the site with the new data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
