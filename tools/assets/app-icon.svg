<!--
  Orbital Traffic — master app icon artwork.

  This is the single source for every raster icon in the project: the PWA set
  under apps/web/public/icons/, the iOS AppIcon, and the 1024x1024 marketing
  icon uploaded to App Store Connect. Regenerate them all with:

      npm run icons:generate

  Editing notes:
  - The whole spacecraft lives in the group with id="craft". The generator
    rewrites ONLY that group's transform attribute to produce the maskable
    variant (the craft is scaled down so it fits the Android safe zone), so
    keep the id and keep the transform attribute on that element.
  - The drop shadow sits on the parent group on purpose. Putting the filter
    on #craft itself would rotate the shadow along with the spacecraft.
  - The background must stay fully opaque and full bleed. App Store Connect
    rejects a marketing icon that carries an alpha channel, and every raster
    here is produced from this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- ============ BACKGROUND ============ -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.00" stop-color="#0f4a4d"/>
      <stop offset="0.22" stop-color="#12414f"/>
      <stop offset="0.48" stop-color="#1a2b45"/>
      <stop offset="0.74" stop-color="#292544"/>
      <stop offset="1.00" stop-color="#3b3560"/>
    </linearGradient>
    <radialGradient id="bgLift" cx="0.18" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#1c6f6a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1c6f6a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgVignette" cx="0.5" cy="0.52" r="0.78">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1.00" stop-color="#00040d" stop-opacity="0.42"/>
    </radialGradient>
    <radialGradient id="craftGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.00" stop-color="#8fd4e8" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#6fb6dd" stop-opacity="0.08"/>
      <stop offset="1.00" stop-color="#6fb6dd" stop-opacity="0"/>
    </radialGradient>

    <!-- ============ SOLAR ARRAYS ============ -->
    <linearGradient id="panelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fabe4"/>
      <stop offset="1" stop-color="#5182c9"/>
    </linearGradient>
    <linearGradient id="panelBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6191d5"/>
      <stop offset="1" stop-color="#3f6fb6"/>
    </linearGradient>
    <linearGradient id="panelSheen" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.40" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1.00" stop-color="#0a1f3d" stop-opacity="0.14"/>
    </linearGradient>

    <!-- ============ BUS / BODY ============ -->
    <linearGradient id="busTop" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eaeef2"/>
      <stop offset="1" stop-color="#cfd6dd"/>
    </linearGradient>
    <linearGradient id="busBot" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d8dee4"/>
      <stop offset="0.55" stop-color="#bfc7cf"/>
      <stop offset="1" stop-color="#9aa4ae"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#131a24"/>
      <stop offset="0.6" stop-color="#0a0e15"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="mast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3e8ed"/>
      <stop offset="0.5" stop-color="#b9c1c9"/>
      <stop offset="1" stop-color="#8e979f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.5" stop-color="#f5c168"/>
      <stop offset="1" stop-color="#e0a344"/>
    </linearGradient>

    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00060f" flood-opacity="0.45"/>
    </filter>

    <!-- One reusable solar array: 6 columns x 2 rows, 272 x 140 -->
    <g id="array">
      <rect x="0" y="0" width="272" height="140" rx="11" fill="url(#panelTop)"/>
      <rect x="0" y="70" width="272" height="70" fill="url(#panelBot)"/>
      <rect x="0" y="0" width="272" height="140" rx="11" fill="url(#panelSheen)"/>
      <g stroke="#2f5c9c" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
        <path d="M45.3 6 V134 M90.7 6 V134 M136 6 V134 M181.3 6 V134 M226.7 6 V134"/>
        <path d="M6 70 H266"/>
      </g>
      <rect x="1.75" y="1.75" width="268.5" height="136.5" rx="9.5"
            fill="none" stroke="#bcdcfb" stroke-width="3.5"/>
    </g>
  </defs>

  <!-- ============ CANVAS ============ -->
  <!-- Opaque and full bleed: no transparency anywhere in this file -->
  <rect width="1024" height="1024" fill="#1a2b45"/>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#bgLift)"/>
  <rect width="1024" height="1024" fill="url(#bgVignette)"/>
  <ellipse cx="512" cy="500" rx="470" ry="300" fill="url(#craftGlow)"/>

  <!-- ============ SPACECRAFT ============ -->
  <g filter="url(#drop)">
    <g id="craft" transform="rotate(-22 512 512) translate(512 512) scale(1.04) translate(-512 -512)">
      <!-- solar arrays -->
      <use href="#array" x="100" y="412"/>
      <use href="#array" x="652" y="412"/>

      <!-- booms joining the arrays to the bus -->
      <rect x="372" y="470" width="46" height="14" rx="7" fill="url(#mast)"/>
      <rect x="606" y="470" width="46" height="14" rx="7" fill="url(#mast)"/>

      <!-- mast and gold instrument bar -->
      <rect x="506" y="551" width="12" height="62" rx="6" fill="url(#mast)"/>
      <rect x="474" y="609" width="76" height="26" rx="7" fill="url(#gold)"/>
      <rect x="474" y="609" width="76" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.28"/>

      <!-- bus body -->
      <rect x="416" y="391" width="192" height="168" rx="20" fill="url(#busBot)"/>
      <path d="M416 411 a20 20 0 0 1 20-20 h152 a20 20 0 0 1 20 20 v56 H416 Z" fill="url(#busTop)"/>
      <path d="M416 467 H608" stroke="#8d979f" stroke-width="3" stroke-opacity="0.75"/>
      <path d="M416 470.5 H608" stroke="#ffffff" stroke-width="2" stroke-opacity="0.45"/>

      <!-- sensor / optics panel -->
      <rect x="443" y="421" width="66" height="35" rx="6" fill="url(#screen)"/>
      <rect x="443" y="421" width="66" height="35" rx="6" fill="none"
            stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.18"/>
      <path d="M447 452 L470 425" stroke="#5f9fd6" stroke-width="4" stroke-opacity="0.30" stroke-linecap="round"/>

      <!-- outer edge definition -->
      <rect x="417.25" y="392.25" width="189.5" height="165.5" rx="18.75"
            fill="none" stroke="#f4f7fa" stroke-width="2.5" stroke-opacity="0.6"/>
    </g>
  </g>
</svg>
